<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1320" viewBox="0 0 1600 1320">
  <style>
    .bg{fill:#f5f7fb}.head{fill:#0b3b78}.title{font:700 36px Segoe UI,Arial,sans-serif;fill:#fff}.sub{font:600 18px Segoe UI,Arial,sans-serif;fill:#dbeafe}.n{fill:#1367d1}.nt{font:700 21px Segoe UI,Arial,sans-serif;fill:#fff}.h{font:700 22px Segoe UI,Arial,sans-serif;fill:#0b5fc6}.term{fill:#07111d;stroke:#18324f;stroke-width:2}.tt{font:700 15px Consolas,monospace;fill:#65c7ff}.txt{font:14px Consolas,monospace;fill:#e5edf5}.ok{font:700 14px Consolas,monospace;fill:#4ade80}.warn{font:700 14px Consolas,monospace;fill:#fde047}.cap{font:14px Segoe UI,Arial,sans-serif;fill:#1f2937}.foot{font:700 24px Segoe UI,Arial,sans-serif;fill:#fff}.small{font:13px Segoe UI,Arial,sans-serif;fill:#334155}
  </style>
  <rect class="bg" width="1600" height="1320"/>
  <rect class="head" width="1600" height="78"/>
  <text class="title" x="28" y="48">One-Button Rebuild — End-to-End Example (PowerShell on Windows)</text>
  <text class="sub" x="1260" y="30">Pi 4 (CentOS 9) → Debian 13</text><text class="sub" x="1260" y="55">PI4-CENTOS9</text>

  <!-- Row 1 -->
  <g transform="translate(22,102)"><circle class="n" cx="20" cy="20" r="20"/><text class="nt" x="14" y="27">1</text><text class="h" x="52" y="27">Open the rebuild folder</text><rect class="term" x="0" y="48" width="500" height="220" rx="4"/><text class="tt" x="16" y="74">Windows PowerShell</text><text class="txt" x="16" y="105">PS C:\Users\operator&gt; cd $HOME\pios-rebuild</text><text class="txt" x="16" y="133">PS ...\pios-rebuild&gt; dir</text><text class="txt" x="16" y="170">config   docs   scripts</text><text class="txt" x="16" y="198">ONE-BUTTON-REBUILD.cmd</text><text class="cap" x="0" y="292">Open PowerShell and go to the checked-out repository.</text></g>
  <g transform="translate(548,102)"><circle class="n" cx="20" cy="20" r="20"/><text class="nt" x="14" y="27">2</text><text class="h" x="52" y="27">Start the one-button process</text><rect class="term" x="0" y="48" width="500" height="220" rx="4"/><text class="tt" x="16" y="74">PIOS REBUILD — FULLY AUTOMATED (HIGHER-RISK)</text><text class="txt" x="16" y="116">PS ...\pios-rebuild&gt; .\ONE-BUTTON-REBUILD.cmd</text><text class="ok" x="16" y="158">One-button rebuild for PASSIVE node</text><text class="txt" x="16" y="194">Backup, rescue, Debian write, restore and validation.</text><text class="cap" x="0" y="292">Launch the controller from the pinned release checkout.</text></g>
  <g transform="translate(1074,102)"><circle class="n" cx="20" cy="20" r="20"/><text class="nt" x="14" y="27">3</text><text class="h" x="52" y="27">Review target summary</text><rect class="term" x="0" y="48" width="500" height="220" rx="4"/><text class="tt" x="16" y="74">=== TARGET SUMMARY ===</text><text class="txt" x="16" y="103">Hostname    : pios-passive-1</text><text class="txt" x="16" y="127">Profile     : PI4-CENTOS9</text><text class="txt" x="16" y="151">Current OS  : CentOS 9 (aarch64)</text><text class="txt" x="16" y="175">Target OS   : Debian 13 (arm64)</text><text class="txt" x="16" y="199">SD Card     : 32 GB</text><text class="warn" x="16" y="236">Start automated rebuild? (Y/N): Y</text><text class="cap" x="0" y="292">Verify the node, profile and destructive target before starting.</text></g>

  <!-- Row 2 -->
  <g transform="translate(22,430)"><circle class="n" cx="20" cy="20" r="20"/><text class="nt" x="14" y="27">4</text><text class="h" x="52" y="27">Environment setup (Git)</text><rect class="term" x="0" y="48" width="500" height="220" rx="4"/><text class="tt" x="16" y="74">=== SETUP ENVIRONMENT ===</text><text class="ok" x="16" y="110">[OK] Working tree clean</text><text class="ok" x="16" y="136">[OK] git fetch origin --prune</text><text class="ok" x="16" y="162">[OK] git pull --ff-only origin main</text><text class="ok" x="16" y="188">[OK] Release commit pinned: a1b2c3d</text><text class="txt" x="16" y="226">ENVIRONMENT_SETUP=PASS</text><text class="cap" x="0" y="292">The release version is fixed; no further pull during the change.</text></g>
  <g transform="translate(548,430)"><circle class="n" cx="20" cy="20" r="20"/><text class="nt" x="14" y="27">5</text><text class="h" x="52" y="27">Pre-flight checks</text><rect class="term" x="0" y="48" width="500" height="220" rx="4"/><text class="tt" x="16" y="74">=== PRE-FLIGHT CHECKS ===</text><text class="ok" x="16" y="108">[OK] VPN / router reachable</text><text class="ok" x="16" y="134">[OK] Passive target reachable</text><text class="ok" x="16" y="160">[OK] Raspberry Pi 4 detected</text><text class="ok" x="16" y="186">[OK] CentOS 9 detected</text><text class="ok" x="16" y="212">[OK] Profile PI4-CENTOS9 matches</text><text class="cap" x="0" y="292">A profile mismatch is a hard STOP with no changes made.</text></g>
  <g transform="translate(1074,430)"><circle class="n" cx="20" cy="20" r="20"/><text class="nt" x="14" y="27">6</text><text class="h" x="52" y="27">Backup and export FreeSWITCH</text><rect class="term" x="0" y="48" width="500" height="220" rx="4"/><text class="tt" x="16" y="74">=== BACKUP AND EXPORT ===</text><text class="ok" x="16" y="108">[OK] Inventory captured</text><text class="ok" x="16" y="134">[OK] FreeSWITCH config exported</text><text class="txt" x="16" y="160">Creating full 32 GB rollback image...</text><text class="ok" x="16" y="186">[OK] Backup checksum verified</text><text class="ok" x="16" y="212">[OK] Artifacts copied off-node</text><text class="cap" x="0" y="292">No destructive step begins until rollback data is verified off-node.</text></g>

  <!-- Row 3 -->
  <g transform="translate(22,758)"><circle class="n" cx="20" cy="20" r="20"/><text class="nt" x="14" y="27">7</text><text class="h" x="52" y="27">Enter proven RAM rescue</text><rect class="term" x="0" y="48" width="500" height="220" rx="4"/><text class="tt" x="16" y="74">=== RAM RESCUE ===</text><text class="ok" x="16" y="108">[OK] Rescue build identity matches</text><text class="ok" x="16" y="134">[OK] kexec image loaded</text><text class="ok" x="16" y="160">[OK] Rescue SSH reachable on TCP/2222</text><text class="ok" x="16" y="186">[OK] Root is RAM-resident</text><text class="ok" x="16" y="212">[OK] 32 GB SD target unmounted</text><text class="cap" x="0" y="292">The Pi 4/CentOS 9 rescue must have been round-trip tested first.</text></g>
  <g transform="translate(548,758)"><circle class="n" cx="20" cy="20" r="20"/><text class="nt" x="14" y="27">8</text><text class="h" x="52" y="27">Write Debian image</text><rect class="term" x="0" y="48" width="500" height="220" rx="4"/><text class="tt" x="16" y="74">=== DESTRUCTIVE WRITE ===</text><text class="txt" x="16" y="108">Target: /dev/mmcblk0 (confirmed whole disk)</text><text class="ok" x="16" y="134">[OK] Debian SHA512 matches approved image</text><text class="txt" x="16" y="160">Writing Debian 13 image...</text><text class="ok" x="16" y="186">[OK] DEBIAN_IMAGE_WRITE_COMPLETE=YES</text><text class="ok" x="16" y="212">[OK] Partition table readable</text><text class="cap" x="0" y="292">This is the destructive point; hard safety gates remain Linux-side.</text></g>
  <g transform="translate(1074,758)"><circle class="n" cx="20" cy="20" r="20"/><text class="nt" x="14" y="27">9</text><text class="h" x="52" y="27">Boot, validate and restore</text><rect class="term" x="0" y="48" width="500" height="220" rx="4"/><text class="tt" x="16" y="74">=== DEBIAN + FREESWITCH ===</text><text class="ok" x="16" y="108">[OK] Debian SSH returned</text><text class="ok" x="16" y="134">[OK] DEBIAN_VALIDATION=PASS</text><text class="ok" x="16" y="160">[OK] FreeSWITCH config restored</text><text class="ok" x="16" y="186">[OK] FreeSWITCH running</text><text class="ok" x="16" y="212">[OK] Smoke test passed</text><text class="cap" x="0" y="292">Service startup is followed by OS and FreeSWITCH validation.</text></g>

  <!-- Row 4 -->
  <g transform="translate(22,1086)"><circle class="n" cx="20" cy="20" r="20"/><text class="nt" x="14" y="27">10</text><text class="h" x="52" y="27">Final checks</text><rect class="term" x="0" y="48" width="500" height="150" rx="4"/><text class="ok" x="16" y="82">[OK] Active peer healthy</text><text class="ok" x="16" y="108">[OK] Rollback image retained</text><text class="ok" x="16" y="134">[OK] Logs and evidence saved</text><text class="ok" x="16" y="160">[OK] All mandatory gates passed</text></g>
  <g transform="translate(548,1086)"><circle class="n" cx="20" cy="20" r="20"/><text class="nt" x="14" y="27">11</text><text class="h" x="52" y="27">Success — ready for soak</text><rect class="term" x="0" y="48" width="500" height="150" rx="4"/><text class="ok" x="16" y="80">ONE-BUTTON REBUILD: SUCCESS</text><text class="txt" x="16" y="108">OS: Debian 13 (arm64)</text><text class="txt" x="16" y="132">Rollback image: VERIFIED</text><text class="ok" x="16" y="160">Final state: READY FOR SOAK</text></g>
  <g transform="translate(1074,1086)"><circle class="n" cx="20" cy="20" r="20"/><text class="nt" x="14" y="27">12</text><text class="h" x="52" y="27">Logs and next steps</text><rect class="term" x="0" y="48" width="500" height="150" rx="4"/><text class="tt" x="16" y="80">=== NEXT STEPS ===</text><text class="txt" x="16" y="108">1. Monitor passive node during soak</text><text class="txt" x="16" y="132">2. Separate production failover release</text><text class="txt" x="16" y="156">3. Rebuild second Pi only after approval</text></g>

  <rect class="head" y="1280" width="1600" height="40"/><text class="foot" x="415" y="1308">One button. Many hard safety gates. Production failover remains separate.</text>
</svg>